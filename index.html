<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord DNUM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
<style>
body { margin: 0; padding: 16px; background: var(--background-alt-grey, #f6f6f6); }
h1 { font-size: 1.5rem; margin: 0 0 .25rem 0; color: var(--text-title-blue-france, #000091); }
#err { display: none; background: #ffe9e9; border-left: 4px solid #ce0500; color: #ce0500; padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #ddd; margin: 12px 0; }
.tb { border: 1px solid #ddd; border-bottom: 0; background: #eee; padding: 8px 14px; cursor: pointer; font: inherit; color: #3a3a3a; }
.tb.on { background: #fff; color: #000091; font-weight: 700; border-top: 2px solid #000091; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #fff; padding: 10px; margin-bottom: 12px; }
.filters input, .filters select { width: auto; min-width: 150px; }
.count { margin-left: auto; font-weight: 700; color: #000091; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: #fff; padding: 10px 12px; border-left: 4px solid #000091; }
.kpi.w { border-left-color: #b34000; }
.kpi .v { font-size: 1.8rem; font-weight: 700; color: #000091; line-height: 1.2; }
.kpi .l { font-size: .8rem; color: #666; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 12px; }
.box { background: #fff; padding: 10px 12px; min-width: 0; margin-bottom: 12px; }
.cols .box { margin-bottom: 0; }
.box h2 { font-size: 1rem; margin: 0 0 8px 0; }
.bar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: .85rem; }
.bar .n { width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .t { flex: 1; background: #e5e5e5; height: 12px; }
.bar .f { background: #000091; height: 12px; }
.bar .c { width: 34px; text-align: right; font-weight: 700; }
.empty { color: #777; font-style: italic; }
.note { font-size: .75rem; color: #666; margin-top: 4px; }
.kpi[data-d], .bar[data-d] { cursor: pointer; }
.kpi.act { outline: 2px solid #000091; background: #e3e3fd; }
.bar.act .n { font-weight: 700; color: #000091; }
.bar.act .f { background: #6a6af4; }
.pt { display: none; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; padding: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tabs, .filters input, .filters select, .filters button { display: none !important; }
  .pt { display: block; color: #666; margin-bottom: 6px; }
  .box, .kpi { break-inside: avoid; }
}
.rt { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.tools { display: flex; gap: 12px; align-items: center; }
.lk { background: none; border: 0; padding: 0; font: inherit; font-size: .75rem; color: #666; text-decoration: underline; cursor: pointer; }
.lk:hover { color: #000091; }
@media print { .tools { display: none !important; } }
.ms { position: relative; }
.ms summary { list-style: none; cursor: pointer; background: #eee; box-shadow: inset 0 -2px 0 0 #3a3a3a; border-radius: .25rem .25rem 0 0; padding: .4rem 2rem .4rem .75rem; font-size: .9rem; min-width: 170px; position: relative; }
.ms summary::-webkit-details-marker { display: none; }
.ms summary::after { content: "\25BE"; position: absolute; right: .75rem; top: .4rem; color: #000091; }
.ms[open] summary { background: #e3e3fd; }
.mp { position: absolute; z-index: 30; top: 100%; left: 0; min-width: 100%; max-height: 280px; overflow: auto; background: #fff; border: 1px solid #ddd; box-shadow: 0 4px 12px rgba(0,0,0,.15); padding: 6px 10px; }
.mp label { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: .85rem; white-space: nowrap; cursor: pointer; }
.bh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.bh h2 { margin: 0; }
.vt { display: inline-flex; gap: 8px; }
.vt .lk { font-size: .7rem; }
.vt .lk.on { font-weight: 700; color: #000091; text-decoration: none; cursor: default; }
.pie { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.lgs { flex: 1; min-width: 150px; }
.lg { display: flex; align-items: center; gap: 6px; font-size: .85rem; margin-bottom: 3px; }
.lg[data-d] { cursor: pointer; }
.lg i { width: 12px; height: 12px; display: inline-block; flex: none; }
.lg .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg .c { font-weight: 700; white-space: nowrap; }
.lg.act .n { font-weight: 700; color: #000091; }
svg.psv path, svg.psv circle { stroke: #fff; stroke-width: 1; }
svg.psv [data-d] { cursor: pointer; }
svg.psv .act { opacity: .7; }
@media print { .vt { display: none !important; } .ms summary::after { display: none; } }
.ic { background: none; border: 0; padding: 4px; line-height: 0; color: #666; cursor: pointer; border-radius: 3px; }
.ic:hover { color: #000091; background: #f0f0f0; }
.ic.on { color: #000091; background: #e3e3fd; cursor: default; }
.vt { gap: 2px; }
.lgs { flex: 1 1 150px; }
text.pt { pointer-events: none; text-anchor: middle; dominant-baseline: central; font-weight: 700; stroke: none; }
.filters input[type="checkbox"] { min-width: 0; width: auto; margin: 0; flex: none; }
.mp label { gap: 5px; }
.pw { position: relative; flex: 1 1 200px; max-width: 340px; min-width: 140px; }
.pw::before { content: ""; display: block; padding-top: 100%; }
.pw svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.ver { margin-top: 16px; font-size: .7rem; color: #666; text-align: right; }
.pl { position: absolute; transform: translate(-50%, -50%); font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; pointer-events: none; }
</style>
</head>
<body>
<h1>Tableau de bord DNUM</h1>
<div id="ptitle" class="pt"></div>
<div id="err"></div>
<div class="tabs" id="tabs"></div>
<div class="filters" id="filters">
  <input type="text" class="fr-input" id="f-q" placeholder="Rechercher un produit">
  <details class="ms" id="ms-users"></details>
  <details class="ms" id="ms-sdir"></details>
  <details class="ms" id="ms-dept"></details>
  <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" id="f-reset">Réinitialiser</button>
  <span id="drill" title="Cliquer pour retirer ce filtre"></span>
  <div class="rt">
    <span class="count" id="count">Chargement...</span>
    <div class="tools">
      <button type="button" class="lk" id="f-csv">Export CSV</button>
      <button type="button" class="lk" id="f-pdf">Export PDF</button>
    </div>
  </div>
</div>
<div id="main"></div>
<footer class="ver" id="ver"></footer>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>
// Version affichée en bas du widget : à incrémenter à chaque modification
var VERSION = { num: "1.6.0", date: "26/11/2026" };

var COL = {
  produit: "Produit", homolDeb: "Debut_de_validite_d_homologation", users: "", dir: "Direction_metier", statut: "Statut_actuel", dept: "Departement_new", crit: "Criticite",
  strat: "Produit_strategique", compl: "Taux_de_completion", maj: "Date_de_derniere_mise_a_jour",
  majAlt: "Date_de_mise_a_jour", vides: "Nombre_de_champs_critiques_vides",
  homol: "Statut_d_homologation_de_securite", homolFin: "Fin_de_validite_d_homologation",
  rgaa: "RGAA_Taux_de_conformite", pca: "Inscription_au_PCA", obso: "Obsolescence",
  c26: "Cible_RenovSI_2026", c27: "Cible_RenovSI_2027", e26: "RenovSI_2026_Etat",
  pic: "tech_PIC_etat_de_la_migration",
  vis: "Vision_strategie", usr: "Connaissance_utilisateurs_design",
  imp: "Mesure_d_impact", del: "Delivery_iteration"
};
// Seuils modifiables
var CFG = { complFaible: 50, rgaaSeuil: 75, joursMaj: 180, moisHomol: 6 };

var TABS = [["overview", "Vue d'ensemble"], ["direction", "Vue par direction métier"], ["portfolio", "Portefeuille"], ["risks", "Risques & conformité"], ["homol", "Homologations"], ["maturity", "Maturité & qualité"]];
function emptyF() { return { q: "", users: [], sdir: [], dept: [] }; }
var ALL = [], F = emptyF(), TAB = "overview", SC = 1, SR = 1, DR = [], DRILL = null;

function showError(m) { var e = document.getElementById("err"); e.style.display = "block"; e.textContent = "Erreur : " + m; }
window.onerror = function (m, s, l) { showError(m + " (ligne " + l + ")"); };

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function toList(v) {
  var o = [], i;
  if (v === null || v === undefined || v === "") { return o; }
  if (Array.isArray(v)) {
    for (i = 0; i < v.length; i++) { if (i === 0 && v[i] === "L") { continue; } if (v[i] !== null && v[i] !== undefined && v[i] !== "") { o.push(String(v[i])); } }
    return o;
  }
  if (typeof v === "string" && v.charAt(0) === "[") { try { return toList(JSON.parse(v)); } catch (e) { return [v]; } }
  return [String(v)];
}
function T(r, c) { var l = toList(r[c]); return l.length ? l[0] : ""; }
function norm(s) {
  s = String(s).toLowerCase();
  try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) {}
  return s;
}
function has(r, c, word) { return norm(toList(r[c]).join(" ")).indexOf(word) !== -1; }
function filled(r, c) { return toList(r[c]).length > 0; }
function isNo(s) { s = norm(s); return s === "non" || s === "aucun" || s === "false" || s === "n/a"; }
function yesList(r, c) { var l = toList(r[c]), i; for (i = 0; i < l.length; i++) { if (!isNo(l[i])) { return true; } } return false; }

// Dates "bouche-trou" (01/01/1900, 01/01/1970, 01/01/2000...) : toute date antérieure au 01/01/2001 est considérée comme vide
var DATE_MIN = new Date(2001, 0, 1);
function toDate(v) { var d = toDateRaw(v); return (d !== null && d < DATE_MIN) ? null : d; }
function toDateRaw(v) {
  var d, m;
  if (v === null || v === undefined || v === "") { return null; }
  if (v instanceof Date) { return isNaN(v.getTime()) ? null : v; }
  if (typeof v === "number") {
    d = new Date(v < 100000000000 ? v * 1000 : v);
    if (isNaN(d.getTime())) { return null; }
    // Colonne Date Grist = minuit UTC : on garde le jour calendaire, quel que soit le fuseau (Paris, Tahiti...)
    if (d.getTime() % 86400000 === 0) { return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
    return d;
  }
  v = String(v).replace(/^\s+|\s+$/g, "");
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) { return new Date(+m[1], +m[2] - 1, +m[3]); }
  m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (m) { return new Date(+m[3], +m[2] - 1, +m[1]); }
  d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(d) { return d ? ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear() : ""; }
function majDate(r) { return toDate(r[COL.maj]) || toDate(r[COL.majAlt]); }
function pct(r, c, sc) { return typeof r[c] === "number" ? Math.round(r[c] * sc) : null; }
function scaleOf(c) { var i, mx = 0; for (i = 0; i < ALL.length; i++) { if (typeof ALL[i][c] === "number" && ALL[i][c] > mx) { mx = ALL[i][c]; } } return (mx > 0 && mx <= 1) ? 100 : 1; }

// Département : colonne Référence vers la table des départements.
// Grist n'envoie que l'identifiant de la ligne : le libellé "Direction/Sous-direction/Département" est lu dans la table (accès complet requis).
var DEPT_TABLE = "Liste_des_departements_et_sous_directions", DEPTS = null, DEPT_ORD = [], SDIR_ORD = [];
function deptInfo(r) {
  var v = r[COL.dept];
  if (v && typeof v === "object" && !Array.isArray(v)) {
    return { lab: String(v.Direction_Sous_direction_Departement || ""), sd: [v.Direction, v.Sous_direction].filter(function (x) { return x; }).join("/") };
  }
  if (typeof v !== "number" || v <= 0) { return null; }
  return (DEPTS && DEPTS[v]) ? DEPTS[v] : { lab: "Département n°" + v, sd: "" };
}
function deptOf(r) { var d = deptInfo(r); return d ? d.lab : ""; }
function sdirOf(r) { var d = deptInfo(r); return d ? d.sd : ""; }
function loadDepts() {
  return Promise.resolve(grist.docApi.fetchTable(DEPT_TABLE)).then(function (t) {
    var idx = [], o = {}, i, k, lab, sd;
    for (i = 0; i < t.id.length; i++) { idx.push(i); }
    if (t.manualSort) { idx.sort(function (a, b) { return t.manualSort[a] - t.manualSort[b]; }); }
    DEPT_ORD = []; SDIR_ORD = [];
    for (k = 0; k < idx.length; k++) {
      i = idx[k];
      lab = String(t.Direction_Sous_direction_Departement ? t.Direction_Sous_direction_Departement[i] || "" : "");
      sd = [t.Direction ? t.Direction[i] : "", t.Sous_direction ? t.Sous_direction[i] : ""].filter(function (x) { return x; }).join("/");
      o[t.id[i]] = { lab: lab, sd: sd };
      if (lab && DEPT_ORD.indexOf(lab) === -1) { DEPT_ORD.push(lab); }
      if (sd && SDIR_ORD.indexOf(sd) === -1) { SDIR_ORD.push(sd); }
    }
    DEPTS = o;
  }).catch(function (e) {
    if (window.console) { console.warn("Table des départements illisible :", e && e.message ? e.message : e); }
  });
}

// Règles métier (à ajuster selon vos valeurs)
// Actif = statut renseigné, ni décommissionné ni transféré ("En cours de transfert" reste actif)
function isActive(r) { var s = norm(T(r, COL.statut)); return s !== "" && s.indexOf("decommission") === -1 && s.indexOf("transfere") === -1; }
function isStrat(r) { return yesList(r, COL.strat); }
function isCrit(r) { var s = norm(T(r, COL.crit)); if (s.indexOf("non") === 0) { return false; } return s.indexOf("critique") !== -1 || s.indexOf("essentiel") !== -1; }
function isObso(r) { return yesList(r, COL.obso) || norm(T(r, COL.statut)).indexOf("decommission") !== -1; }
// Statut d'homologation : comparaison aux valeurs exactes de la liste de choix Grist
function homolS(r) { return norm(T(r, COL.homol)).replace(/^\s+|\s+$/g, ""); }
function homolOk(r) { return homolS(r) === "homologuee"; }
function homolEnCours(r) { return homolS(r) === "homologation en cours"; }
function homolNonEngagee(r) { return homolS(r).indexOf("homologation non engagee") === 0; }
function homolNA(r) { return homolS(r) === "n/a"; }
function homolBientot(r) {
  var d = toDate(r[COL.homolFin]), now = new Date(), lim = new Date();
  lim.setMonth(lim.getMonth() + CFG.moisHomol);
  return d !== null && d <= lim;
}
function noPca(r) { return isCrit(r) && norm(T(r, COL.pca)).indexOf("oui") === -1; }
function rgaaBas(r) { var p = pct(r, COL.rgaa, SR); return p !== null && p < CFG.rgaaSeuil; }
function complBas(r) { var p = pct(r, COL.compl, SC); return p !== null && p < CFG.complFaible; }
function vieux(r) { var d = majDate(r); return d === null || ((new Date()) - d) / 86400000 > CFG.joursMaj; }
function videsCrit(r) { return typeof r[COL.vides] === "number" && r[COL.vides] > 0; }
function statutIs(r, w) {
  var s = norm(T(r, COL.statut));
  if (w === "adecom") { return s.indexOf("decommissionner") !== -1; }
  if (w === "decom") { return s.indexOf("decommission") !== -1 && s.indexOf("decommissionner") === -1; }
  return s.indexOf(w) !== -1;
}
function cible26(r) { return yesList(r, COL.c26); }
function cible27(r) { return yesList(r, COL.c27); }
function sansTraj(r) { return !cible26(r) && !cible27(r); }
function migFaite(r) { var s = norm(T(r, COL.e26)); return s.indexOf("effectu") !== -1 || s.indexOf("termin") !== -1 || s.indexOf("realis") !== -1; }
function migEnCours(r) { return norm(T(r, COL.e26)).indexOf("en cours") !== -1; }
var DIMS = [["Vision & stratégie", "vis"], ["Connaissance utilisateurs & design", "usr"], ["Mesure d'impact", "imp"], ["Delivery & itération", "del"]];
function matInc(r) { var i; for (i = 0; i < DIMS.length; i++) { if (!filled(r, COL[DIMS[i][1]])) { return true; } } return false; }

function passF(r) {
  if (F.q !== "" && norm(T(r, COL.produit)).indexOf(norm(F.q)) === -1) { return false; }
  if (F.users.length && F.users.indexOf(usersOf(r)) === -1) { return false; }
  if (F.sdir.length && F.sdir.indexOf(sdirOf(r)) === -1) { return false; }
  if (F.dept.length && F.dept.indexOf(deptOf(r)) === -1) { return false; }
  if (DRILL !== null && !DRILL.fn(r)) { return false; }
  return true;
}

// Briques d'affichage
function cnt(rows, fn) { var n = 0, i; for (i = 0; i < rows.length; i++) { if (fn(rows[i])) { n++; } } return n; }
function reg(label, fn) { DR.push({ label: label, fn: fn }); return DR.length - 1; }
function isAct(label) { return DRILL !== null && DRILL.label === label; }
function kpis(rows, items) {
  var h = '<div class="kpis">', i, it, v, a, lab;
  for (i = 0; i < items.length; i++) {
    it = items[i]; a = ""; lab = "KPI : " + it[0];
    if (typeof it[1] === "function") { v = cnt(rows, it[1]); a = ' data-d="' + reg(lab, it[1]) + '" title="Cliquer pour filtrer"'; } else { v = it[1]; }
    h += '<div class="kpi' + (it[2] ? " w" : "") + (isAct(lab) ? " act" : "") + '"' + a + '><div class="v">' + v + '</div><div class="l">' + esc(it[0]) + "</div></div>";
  }
  return h + "</div>";
}
// fn peut renvoyer une valeur ou une liste (colonne à choix multiples) : un produit est alors compté dans chacune de ses valeurs
function keysOf(fn, r) { var v = fn(r); if (Array.isArray(v)) { return v.length ? v : ["(non renseigné)"]; } return [v || "(non renseigné)"]; }
function countBy(rows, fn) { var o = {}, i, j, ks; for (i = 0; i < rows.length; i++) { ks = keysOf(fn, rows[i]); for (j = 0; j < ks.length; j++) { o[ks[j]] = (o[ks[j]] || 0) + 1; } } return o; }
function mk(fn, k) { return function (r) { return keysOf(fn, r).indexOf(k) !== -1; }; }
function multi(c) { var f = function (r) { return toList(r[c]); }; f.multi = true; return f; }
var CS = {}, PAL = ["#000091", "#6a6af4", "#009081", "#a558a0", "#b34000", "#417dc4", "#c3992a", "#ce614a"];
function pieHtml(keys, counts, tot, title, fn) {
  var items = [], other = 0, i, ang = -Math.PI / 2, a2, f, c, lab, sv = "", lg = "", at, act, x1, y1, x2, y2, R = 64, mid = 0, tt = "";
  for (i = 0; i < keys.length; i++) {
    if (keys.length > 8 && i >= 7) { other += counts[keys[i]]; } else { items.push([keys[i], counts[keys[i]], false]); }
  }
  if (other) { items.push(["Autres", other, true]); }
  for (i = 0; i < items.length; i++) {
    c = items[i][2] ? "#929292" : PAL[i % PAL.length];
    lab = title + " : " + items[i][0];
    act = (!items[i][2] && isAct(lab)) ? " act" : "";
    at = items[i][2] ? "" : ' data-d="' + reg(lab, mk(fn, items[i][0])) + '" title="' + esc(items[i][0]) + ' : cliquer pour filtrer"';
    f = items[i][1] / tot;
    if (items.length === 1) {
      sv += '<circle cx="70" cy="70" r="' + R + '" fill="' + c + '"' + at + ' class="' + act + '"/>';
    } else {
      a2 = ang + f * 2 * Math.PI;
      mid = ang + f * Math.PI;
      x1 = (70 + R * Math.cos(ang)).toFixed(2); y1 = (70 + R * Math.sin(ang)).toFixed(2);
      x2 = (70 + R * Math.cos(a2)).toFixed(2); y2 = (70 + R * Math.sin(a2)).toFixed(2);
      sv += '<path d="M70 70 L' + x1 + " " + y1 + " A" + R + " " + R + " 0 " + (f > 0.5 ? 1 : 0) + " 1 " + x2 + " " + y2 + ' Z" fill="' + c + '"' + at + ' class="' + act + '"/>';
      ang = a2;
    }
    tt += '<span class="pl" data-al="' + (f * 2 * Math.PI).toFixed(4) + '" data-mid="' + mid.toFixed(4) + '" style="color:' + tcol(c) + ";left:" + (items.length === 1 ? 50 : 50 + 62 * R / 140 * 100 / 64 * 0.0 + (0.62 * R * Math.cos(mid)) * 100 / 140).toFixed(2) + "%;top:" + (items.length === 1 ? 50 : 50 + (0.62 * R * Math.sin(mid)) * 100 / 140).toFixed(2) + '%">' + items[i][1] + "</span>";
    lg += '<div class="lg' + act + '"' + at + '><i style="background:' + c + '"></i><span class="n">' + esc(items[i][0]) + '</span><span class="c">' + items[i][1] + " · " + Math.round(f * 100) + " %</span></div>";
  }
  return '<div class="pie"><div class="pw"><svg class="psv" viewBox="0 0 140 140" role="img" aria-label="' + esc(title) + '">' + sv + '</svg>' + tt + '</div><div class="lgs">' + lg + "</div></div>";
}
var ICO = {
